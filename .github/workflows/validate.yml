name: validate
on:
  pull_request:
    paths: ["public/data/**", "scripts/**"]
  push:
    branches: [main]
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate.mjs
